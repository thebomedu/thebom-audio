<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE BOM · Unit 편집 미리보기</title>
<style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#20452d;background:#f4f8f4}*{box-sizing:border-box}body{margin:0}header{background:#27764d;color:white;padding:20px max(18px,calc((100vw - 1000px)/2))}header h1{margin:4px 0;font-size:24px}main{max-width:1000px;margin:24px auto;padding:0 16px 50px}.banner{background:#fff3d4;border:1px solid #eacb75;border-radius:12px;padding:14px;margin-bottom:18px}.card{background:white;border:1px solid #dce8df;border-radius:16px;padding:20px;margin:14px 0}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.between{justify-content:space-between}button,select,input,textarea{font:inherit;border:1px solid #b8d1be;border-radius:9px;padding:10px}button{background:#28774f;color:white;border:0;cursor:pointer}button.secondary{background:#e7f3eb;color:#225b39}button.danger{background:#fff0ed;color:#a23b2a}button:disabled{opacity:.45;cursor:not-allowed}select{max-width:100%}label{display:block;font-weight:650;margin:10px 0 4px}.field{flex:1 1 190px}input,textarea{width:100%}textarea{min-height:62px}.step{border:1px solid #dce8df;border-radius:12px;padding:14px;margin:12px 0}.muted{color:#60796a;font-size:14px}.badge{background:#e7f3eb;border-radius:20px;padding:6px 12px}.hidden{display:none}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}h2{font-size:20px;margin:0 0 14px}
</style></head><body><header><small>THE BOM LEARNING LAB · DEVELOPMENT PREVIEW</small><h1>📚 Unit별 학습 과정 편집</h1></header><main>
<div class="banner"><strong>🟡 시연용 미리보기</strong><div>실제 학원 데이터·Supabase·학생 홈페이지와 연결되지 않습니다. 이 화면에서 수정한 내용은 현재 브라우저에만 저장됩니다.</div></div>
<section class="card"><h2>교재 설정</h2><div class="row"><div class="field"><label>교재</label><select id="book"><option>The Best Reading 3.3 (예시)</option></select></div><div class="field"><label>Unit 선택</label><select id="unit"></select></div></div><p id="status" class="muted"></p><div class="actions"><button id="reset" class="secondary">이 Unit을 교재 기본 과정으로 복원</button><button id="copy" class="secondary">다른 Unit에서 과정 복사</button><select id="source" aria-label="복사할 Unit"></select></div></section>
<section class="card"><div class="row between"><h2>학습 단계 편집</h2><span class="badge" id="count"></span></div><p class="muted">기본 과정은 Unit 1~12에 공통 적용됩니다. 개별 편집 시 해당 Unit만 달라집니다.</p><div id="steps"></div><div class="actions"><button id="add" class="secondary">+ 단계 추가</button><button id="save">이 Unit 과정 저장</button></div><p id="notice" role="status" class="muted"></p></section>
<section class="card"><h2>👩‍🎓 학생 화면 미리보기</h2><p class="muted">선택한 Unit의 학습 단계가 학생에게 어떻게 보이는지 확인합니다. 실제 진도 저장은 하지 않습니다.</p><div id="student"></div></section>
</main><script>
const key='thebom-unit-preview-v1';
const defaults=[{name:'단어 듣기',desc:'단어 음원을 듣고 뜻을 확인해요.',page:'',kind:'word'},{name:'클래스카드 스피킹',desc:'문장을 녹음하고 테스트해요.',page:'',kind:'classcard'},{name:'동시통역 훈련',desc:'문장을 끊어 읽고 해석해요.',page:'',kind:'reading'},{name:'마인드맵',desc:'핵심 내용을 정리해요.',page:'',kind:''},{name:'문제 풀이',desc:'내용을 이해했는지 확인해요.',page:'',kind:''}];
let overrides={};try{const saved=JSON.parse(localStorage.getItem(key)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))overrides=saved}catch{}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
for(let i=1;i<=12;i++){for(let id of ['unit','source']){let o=document.createElement('option');o.value=i;o.textContent='Unit '+i;$(id).appendChild(o)}}
$('source').value='1';let draft=[];
function selected(){return $('unit').value}function sourceSteps(n){return structuredClone(overrides[n]||defaults)}
function show(){const u=selected();draft=sourceSteps(u);$('status').textContent=overrides[u]?'✏️ 이 Unit은 개별 학습 과정이 적용됩니다.':'🌱 교재 기본 학습 과정이 적용됩니다.';draw()}
function readDraft(){document.querySelectorAll('.step').forEach((el,i)=>{if(!draft[i])return;for(let field of ['name','desc','page','kind'])draft[i][field]=el.querySelector('[data-field="'+field+'"]').value})}
function draw(){const root=$('steps');root.innerHTML=draft.map((s,i)=>'<div class="step"><div class="row between"><strong>STEP '+(i+1)+'</strong><div class="actions"><button class="secondary" data-action="up" data-i="'+i+'" '+(i===0?'disabled':'')+'>↑</button><button class="secondary" data-action="down" data-i="'+i+'" '+(i===draft.length-1?'disabled':'')+'>↓</button><button class="danger" data-action="delete" data-i="'+i+'">삭제</button></div></div><div class="row"><div class="field"><label>단계 이름</label><input data-field="name" value="'+esc(s.name)+'"></div><div class="field"><label>연결 유형</label><select data-field="kind">'+[['','일반 학습'],['word','단어 음원'],['reading','리딩 음원'],['classcard','클래스카드']].map(([v,t])=>'<option value="'+v+'" '+(s.kind===v?'selected':'')+'>'+t+'</option>').join('')+'</select></div></div><label>학습 안내</label><textarea data-field="desc">'+esc(s.desc)+'</textarea><label>페이지</label><input data-field="page" value="'+esc(s.page)+'"></div>').join('');$('count').textContent=draft.length+'단계';preview()}
function preview(){const st=draft;$('student').innerHTML='<h3>Unit '+esc(selected())+'</h3>'+st.map((s,i)=>'<div class="step"><label><input type="checkbox" style="width:auto"> '+(i+1)+'. '+esc(s.name||'(이름 없음)')+'</label><p class="muted">'+esc(s.desc)+'</p>'+(s.kind?'<span class="badge">'+esc({word:'🎧 단어 음원',reading:'🎧 리딩 음원',classcard:'🎤 클래스카드'}[s.kind]||'')+' · 실제 링크 없음</span>':'')+'</div>').join('')}
$('unit').addEventListener('change',show);
$('steps').addEventListener('input',()=>{readDraft();preview()});
$('steps').addEventListener('change',()=>{readDraft();preview()});
$('steps').addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;readDraft();const i=Number(btn.dataset.i),act=btn.dataset.action;if(act==='delete'){if(draft.length===1)return alert('최소 한 단계가 필요합니다.');draft.splice(i,1)}else{const j=i+(act==='up'?-1:1);if(j<0||j>=draft.length)return;[draft[i],draft[j]]=[draft[j],draft[i]]}draw()});
$('add').onclick=()=>{readDraft();draft.push({name:'',desc:'',page:'',kind:''});draw()};
$('save').onclick=()=>{readDraft();if(draft.some(x=>!x.name.trim()))return alert('모든 단계 이름을 입력해 주세요.');overrides[selected()]=structuredClone(draft);localStorage.setItem(key,JSON.stringify(overrides));$('notice').textContent='시연용 저장 완료! 실제 데이터에는 반영되지 않았습니다.';show()};
$('reset').onclick=()=>{if(!confirm('이 Unit의 시연용 개별 설정을 초기화할까요?'))return;delete overrides[selected()];localStorage.setItem(key,JSON.stringify(overrides));$('notice').textContent='기본 과정으로 복원했습니다.';show()};
$('copy').onclick=()=>{readDraft();const n=$('source').value;if(!confirm('Unit '+n+'의 학습 과정을 현재 Unit '+selected()+'으로 복사할까요? (저장 버튼을 눌러야 확정됩니다.)'))return;draft=sourceSteps(n);draw();$('notice').textContent='복사했습니다. 확인 후 저장하세요.'};
show();
</script></body></html>
