<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#28774f"><link rel="manifest" href="manifest.webmanifest"><title>THE BOM LEARNING LAB</title><style>
:root{--g:#28774f;--bg:#f6faf7;--line:#dce9df;--muted:#6c8072}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#183c29;font-family:system-ui,'Noto Sans KR',sans-serif}header{background:var(--g);color:white;padding:18px max(20px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:19px}header small{display:block;font-size:12px;opacity:.8}.wrap{max-width:1100px;margin:25px auto;padding:0 18px 60px}.hero{background:#e8f5eb;border:1px solid var(--line);border-radius:20px;padding:25px;margin-bottom:18px}.hero h1{margin:4px 0 8px;font-size:26px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.muted{font-size:13px;color:var(--muted)}.btn{background:var(--g);color:white;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.secondary{background:#e8f5eb;color:var(--g)}.btn.danger{background:#fff0ed;color:#a7463a}.btn:disabled{opacity:.5}.field{display:flex;flex-direction:column;gap:6px;margin:8px 0 14px;flex:1;min-width:190px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #cadbce;border-radius:10px;padding:11px;background:white;font:inherit;min-height:42px}.field textarea{min-height:80px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}nav button{background:white;border:1px solid var(--line);padding:10px 13px;border-radius:25px;color:var(--g);cursor:pointer}nav button.active{background:var(--g);color:white}.bar{background:#e4eee7;border-radius:10px;height:10px;overflow:hidden;margin:10px 0}.bar>div{height:100%;background:#62ac7d}.step{padding:15px;border:1px solid var(--line);border-radius:13px;margin:10px 0}.step.done{background:#eff9f1}.step label{display:flex;align-items:flex-start;gap:10px;font-weight:700}.step input{width:19px;height:19px;accent-color:var(--g)}.step audio{display:block;max-width:520px;width:100%;margin:12px 0}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.notice{padding:13px;background:#fff7dd;border-radius:12px;margin-bottom:18px;font-size:13px}.login{max-width:470px;margin:30px auto}.table{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:650px}td,th{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}th{background:#edf7ef}.tag{background:#e6f4e9;color:var(--g);border-radius:20px;padding:4px 9px;font-size:12px;font-weight:700}a{color:var(--g)}.empty{padding:25px;text-align:center;color:var(--muted)}#status{font-size:13px;color:#f9fff9}footer{text-align:center;color:#819489;font-size:12px;margin-top:35px}@media(max-width:600px){.wrap{margin:14px auto}.hero{padding:19px}.hero h1{font-size:23px}.card{padding:15px}header strong{font-size:15px}}
</style></head><body><header><div><strong>🌿 THE BOM LEARNING LAB</strong><small>Play · Learn · Bloom</small></div><div class="row"><span id="status"></span><button class="btn secondary" id="logout" style="display:none" onclick="logout()">로그아웃</button></div></header><main class="wrap"><div id="app">연결 준비 중...</div><footer>THE BOM ENGLISH ACADEMY · 개별 맞춤 자기주도 학습</footer></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
const C=window.THEBOM_CONFIG||{},app=document.getElementById('app'),status=document.getElementById('status');let sb=null,me=null,profile=null,tab='dashboard',cache={},studentAssignment=null,studentUnit=null;
const DEFAULT_STEPS=[{name:'단어 듣기',desc:'단어 음원을 듣고 발음과 뜻을 익혀요.',page:'p.1~2',kind:'word'},{name:'리딩 듣고 따라 읽기',desc:'문장 듣기 → 따라 읽기 → 동사 찾기 → 단어 복습',page:'p.3~5',kind:'reading'},{name:'직독직해',desc:'영어 어순대로 해석해요.',page:'p.6'},{name:'마인드맵',desc:'핵심 단어를 채우고 이야기의 흐름을 정리해요.',page:'p.7'},{name:'클래스카드 스피킹',desc:'영어 문장을 녹음하고 테스트해요.',page:'온라인',kind:'classcard'},{name:'영작',desc:'영어로 써봐요.',page:'p.8'},{name:'동시통역훈련',desc:'한글을 보고 영어로 바로 말해요!',page:'p.9~11'},{name:'마무리',desc:'Unit Test · SUMMARY',page:'p.12~13'}];
const cats=['Level 1 · Easy','Level 2 · Basic','Level 3 · Insight','저절로 - 스타터1','저절로 - 스타터2','저절로 - 브릿지1','저절로 - 브릿지2','저절로 - 입문1','저절로 - 입문2'];
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const field=(label,id,type='text',value='',extra='')=>`<div class="field"><label for="${id}">${E(label)}</label><input id="${id}" type="${type}" value="${E(value)}" ${extra}></div>`;
const button=(name,action,style='')=>`<button class="btn ${style}" onclick="${action}">${name}</button>`;
function msg(x){alert(x)}function fail(e){console.error(e);msg('처리 중 오류가 발생했습니다. '+(e?.message||e))}
function requireConfigured(){return C.supabaseUrl&&C.supabaseAnonKey&&!C.supabaseUrl.includes('YOUR_')&&!C.supabaseAnonKey.includes('YOUR_')}
async function start(){if(!requireConfigured()){app.innerHTML=`<div class="hero"><h1>🌿 더봄 클라우드 앱 설치 준비</h1><p>Supabase 프로젝트를 만든 뒤 <b>config.js</b>에 Project URL과 publishable/anon 키를 입력해 주세요.</p></div><div class="notice">아직 서버가 연결되지 않았습니다. 실제 학생 정보는 입력하지 마세요. ZIP의 README.md 순서대로 진행해 주세요.</div>`;return}if(!window.supabase){app.innerHTML='<div class="notice">인터넷 연결 또는 Supabase 라이브러리 로딩을 확인해 주세요.</div>';return}sb=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey);const {data:{session}}=await sb.auth.getSession();me=session?.user||null;await refresh();sb.auth.onAuthStateChange((_event,s)=>{if((s?.user?.id||null)!==(me?.id||null)){me=s?.user||null;setTimeout(()=>refresh(),0)}})}
async function refresh(){document.getElementById('logout').style.display=me?'':'none';if(!me){profile=null;status.textContent='';login();return}const {data,error}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();if(error){app.innerHTML=`<div class="notice">프로필 조회 실패: ${E(error.message)}. schema.sql을 실행했는지 확인해 주세요.</div>`;return}profile=data;if(!profile){app.innerHTML='<div class="notice">계정은 생성되었지만 학생/관리자 프로필이 등록되지 않았습니다. 원장님이 Supabase에서 프로필을 연결해 주세요.</div>';return}status.textContent=profile.display_name+' · '+(profile.role==='admin'?'관리자':profile.role==='teacher'?'선생님':'학생');await loadData();render()}
function login(){app.innerHTML=`<div class="login"><div class="hero"><h1>오늘도 한 걸음 성장해요 🌱</h1><p>내 교재와 학습 계획을 확인해 보세요.</p></div><div class="card"><h2>로그인</h2>${field('이메일','email','email')}${field('비밀번호','password','password')}<button class="btn" onclick="signIn()">로그인 →</button><p class="muted">학생 계정은 원장님이 발급합니다. 회원가입은 공개하지 않습니다.</p></div></div>`}
async function signIn(){try{let {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;await refresh()}catch(e){fail(e)}}async function logout(){await sb.auth.signOut();me=null;profile=null;refresh()}
async function loadData(){let tables=profile.role==='admin'?['profiles','books','assignments','materials','progress','approvals','teacher_students','book_categories']:profile.role==='teacher'?['profiles','books','assignments','materials','progress','approvals','teacher_students','book_categories']:['books','assignments','materials','progress','approvals'];let out=await Promise.all(tables.map(t=>sb.from(t).select('*')));out.forEach((r,i)=>{if(r.error)console.error(tables[i],r.error);cache[tables[i]]=r.data||[]});if(profile.role==='student')cache.profiles=[profile]}
function getBook(id){return (cache.books||[]).find(b=>b.id===id)}function getStudent(id){return(cache.profiles||[]).find(p=>p.id===id)}function steps(a){return a.custom_steps||getBook(a.book_id)?.steps||DEFAULT_STEPS}function row(a,u){return(cache.progress||[]).find(p=>p.assignment_id===a.id&&p.unit===u)}function checks(a,u){return row(a,u)?.checked||[]}function approved(a,u){return(cache.approvals||[]).some(x=>x.assignment_id===a.id&&x.unit===u)}function percentage(a){let b=getBook(a.book_id);if(!b)return 0;let count=0;for(let u=a.start_unit;u<=b.units;u++)count+=checks(a,u).length;return Math.round(count/Math.max(1,(b.units-a.start_unit+1)*steps(a).length)*100)}function current(a){let b=getBook(a.book_id);for(let u=a.start_unit;u<=b.units;u++)if(checks(a,u).length<steps(a).length)return u;return b.units}
function render(){profile.role==='admin'?renderAdmin():profile.role==='teacher'?renderTeacher():renderStudent()}
function renderStudent(){let assignments=(cache.assignments||[]).filter(a=>a.student_id===me.id);if(!assignments.length){app.innerHTML=`<div class="hero"><h1>안녕, ${E(profile.display_name)}! 🌱</h1><p>아직 배정된 교재가 없습니다. 선생님에게 문의해 주세요.</p></div>`;return}let a=assignments.find(a=>a.id===studentAssignment)||assignments[0];studentAssignment=a.id;let b=getBook(a.book_id);if(!b){app.innerHTML='<div class="notice">교재 정보를 불러오지 못했습니다.</div>';return}if(!studentUnit||studentUnit<a.start_unit||studentUnit>b.units)studentUnit=current(a);let u=studentUnit,done=checks(a,u),st=steps(a),mat=(cache.materials||[]).find(m=>m.book_id===b.id&&m.unit===u)||{};app.innerHTML=`<div class="hero"><span class="tag">MY LEARNING</span><h1>안녕, ${E(profile.display_name)}! 🌿</h1><p>오늘의 학습을 하나씩 완료해 보세요.</p></div><div class="card"><h2>📚 내 교재</h2><div class="row">${assignments.map(x=>`<button class="btn ${x.id===a.id?'':'secondary'}" onclick="chooseAssignment('${x.id}')">${E(getBook(x.book_id)?.title||'교재')}</button>`).join('')}</div><div class="bar"><div style="width:${percentage(a)}%"></div></div><p class="muted">교재 전체 학습 단계 ${percentage(a)}% 완료</p><div class="field"><label>학습할 Unit</label><select onchange="chooseUnit(this.value)">${Array.from({length:b.units-a.start_unit+1},(_,i)=>i+a.start_unit).map(n=>`<option value="${n}" ${n===u?'selected':''}>Unit ${n} ${approved(a,n)?'· 선생님 확인 완료':checks(a,n).length===st.length?'· 학습 완료':''}</option>`).join('')}</select></div></div><div class="card"><div class="row between"><h2>📖 ${E(b.title)} · Unit ${u}</h2><span class="tag">${done.length}/${st.length} 단계</span></div><div class="bar"><div style="width:${Math.round(done.length/Math.max(1,st.length)*100)}%"></div></div>${st.map((s,i)=>{let checked=done.includes(i),url=s.kind==='word'?mat.word_url:s.kind==='reading'?mat.reading_url:null;return `<div class="step ${checked?'done':''}"><label><input type="checkbox" ${checked?'checked':''} onchange="toggleStep(${i},this.checked)"><span>${String(i+1).padStart(2,'0')} ${E(s.name)} <span class="muted">${E(s.page||'')}</span></span></label><p class="muted">${E(s.desc||'')}</p>${url?`<audio controls preload="none" src="${E(url)}"></audio>`:''}${s.kind==='classcard'&&mat.classcard_url?`<p><a class="btn secondary" href="${E(mat.classcard_url)}" target="_blank" rel="noopener noreferrer">클래스카드 바로가기 ↗</a></p>`:''}</div>`}).join('')}${mat.publisher_url?`<p><a href="${E(mat.publisher_url)}" target="_blank" rel="noopener noreferrer">출판사 음원 자료실 ↗</a></p>`:''}<div class="notice">${approved(a,u)?'🎉 선생님 최종 확인 완료!':done.length===st.length?'🎉 모든 단계를 체크했어요! 선생님 확인을 기다려요.':'학습을 완료한 뒤 체크하세요. 체크 기록은 계정에 저장됩니다.'}</div></div>`}
function chooseAssignment(id){studentAssignment=id;studentUnit=null;render()}function chooseUnit(v){studentUnit=Number(v);render()}
async function toggleStep(i,on){let a=cache.assignments.find(x=>x.id===studentAssignment),u=studentUnit;let next=new Set(checks(a,u));on?next.add(i):next.delete(i);try{const {error}=await sb.from('progress').upsert({assignment_id:a.id,unit:u,checked:[...next].sort((x,y)=>x-y),updated_at:new Date().toISOString()},{onConflict:'assignment_id,unit'});if(error)throw error;await loadData();render()}catch(e){fail(e);render()}}
function renderAdmin(){const tabs=[['dashboard','학습 현황'],['books','교재 관리'],['categories','카테고리 관리'],['students','학생·배정'],['teachers','선생님 관리'],['plans','개별 진도표'],['materials','Unit 자료']];app.innerHTML=`<div class="hero"><span class="tag">TEACHER DASHBOARD</span><h1>원장님 학습관리 🌿</h1><p>교재를 등록하고, 학생별 진도표와 학습 현황을 관리하세요.</p></div><nav>${tabs.map(([id,name])=>`<button class="${tab===id?'active':''}" onclick="setTab('${id}')">${name}</button>`).join('')}</nav><div id="panel"></div>`;const f={dashboard:dashboard,books:booksView,categories:categoriesView,students:studentsView,teachers:teachersView,plans:plansView,materials:materialsView}[tab];document.getElementById('panel').innerHTML=f();if(tab==='materials')matBookChanged();if(tab==='plans')planChanged()}
function setTab(t){tab=t;renderAdmin()}
function dashboard(){let as=cache.assignments||[];return `<div class="grid"><div class="card"><h2>👩‍🎓 학생</h2><h1>${(cache.profiles||[]).filter(x=>x.role==='student').length}명</h1></div><div class="card"><h2>📚 등록 교재</h2><h1>${(cache.books||[]).length}권</h1></div><div class="card"><h2>📋 교재 배정</h2><h1>${as.length}건</h1></div></div><div class="card"><h2>학생별 학습 현황</h2><div class="table"><table><thead><tr><th>학생</th><th>교재</th><th>현재 Unit</th><th>전체 진행률</th><th>선생님 확인</th></tr></thead><tbody>${as.map(a=>{let b=getBook(a.book_id),u=current(a);return `<tr><td>${E(getStudent(a.student_id)?.display_name||'학생')}</td><td>${E(b?.title)}</td><td>Unit ${u}</td><td>${percentage(a)}%</td><td>${checks(a,u).length===steps(a).length&&!approved(a,u)?button('최종 확인',`approveUnit('${a.id}',${u})`):approved(a,u)?'확인 완료':'학습 중'}</td></tr>`}).join('')}</tbody></table></div></div>`}
async function approveUnit(id,u){let a=cache.assignments.find(x=>x.id===id);if(!a||checks(a,u).length!==steps(a).length)return msg('모든 단계를 체크한 Unit만 확인할 수 있습니다.');if(!confirm('선생님 최종 완료 처리할까요?'))return;try{let {error}=await sb.from('approvals').upsert({assignment_id:id,unit:u,approved_by:me.id,approved_at:new Date().toISOString()},{onConflict:'assignment_id,unit'});if(error)throw error;await loadData();render()}catch(e){fail(e)}}
function categoryOptions(){const all=cache.book_categories||[],roots=all.filter(x=>!x.parent_id).sort((a,b)=>a.sort_order-b.sort_order);return roots.map(p=>{let children=all.filter(x=>x.parent_id===p.id).sort((a,b)=>a.sort_order-b.sort_order);return (children.length?children:[p]).map(c=>`<option value="${E(c.id)}">${E(p.name)}${c.id!==p.id?' / '+E(c.name):''}</option>`).join('')}).join('')}
function categoryName(id){let all=cache.book_categories||[],c=all.find(x=>x.id===id);if(!c)return '';let p=all.find(x=>x.id===c.parent_id);return(p?p.name+' / ':'')+c.name}
function categoriesView(){const all=cache.book_categories||[],roots=all.filter(x=>!x.parent_id).sort((a,b)=>a.sort_order-b.sort_order);let html='<div class="card"><h2>카테고리 관리</h2><p class="muted">대분류와 하위 카테고리를 자유롭게 관리할 수 있어요.</p><div class="row">'+field('새 대분류 이름','newRoot')+button('대분류 추가','addCategory(null)')+'</div></div>';for(const p of roots){html+='<div class="card"><div class="row between"><h3>📁 '+E(p.name)+'</h3><div class="row">'+button('이름 수정',"renameCategory('"+p.id+"')",'secondary')+button('삭제',"deleteCategory('"+p.id+"')",'danger')+'</div></div>';for(const c of all.filter(x=>x.parent_id===p.id).sort((a,b)=>a.sort_order-b.sort_order)){html+='<div class="item row between"><span>↳ '+E(c.name)+'</span><div class="row">'+button('수정',"renameCategory('"+c.id+"')",'secondary')+button('삭제',"deleteCategory('"+c.id+"')",'danger')+'</div></div>'}html+='<div class="row">'+field('새 하위 카테고리','child_'+p.id)+button('하위 카테고리 추가',"addCategory('"+p.id+"')")+'</div></div>'}return html}
async function addCategory(parent){let input=document.getElementById(parent?'child_'+parent:'newRoot'),name=input.value.trim();if(!name)return msg('카테고리 이름을 입력하세요.');try{let {error}=await sb.from('book_categories').insert({name,parent_id:parent});if(error)throw error;await loadData();render()}catch(e){fail(e)}}
async function renameCategory(id){let c=(cache.book_categories||[]).find(x=>x.id===id);if(!c)return;let name=prompt('새 카테고리 이름',c.name);if(name===null)return;name=name.trim();if(!name)return msg('이름을 입력하세요.');try{let {error}=await sb.from('book_categories').update({name}).eq('id',id);if(error)throw error;await loadData();render()}catch(e){fail(e)}}
async function deleteCategory(id){if(!confirm('삭제할까요? 연결된 교재나 하위 카테고리가 있으면 삭제되지 않습니다.'))return;try{let {error}=await sb.from('book_categories').delete().eq('id',id);if(error)throw error;await loadData();render()}catch(e){fail(e)}}
function booksView(){return `<div class="card"><h2>새 교재 등록</h2><div class="row">${field('교재명','bookTitle','text','','placeholder="예: Level 1 · Easy 2"')}<div class="field"><label>카테고리</label><select id="bookCategory">${categoryOptions()}</select></div>${field('Unit 개수','bookUnits','number',12,'min="1" max="200"')}</div>${button('+ 교재 등록','addBook()')}</div><div class="card"><h2>교재 라이브러리</h2>${(cache.books||[]).map(b=>`<div class="item row between"><div><b>${E(b.title)}</b><p class="muted">${E(categoryName(b.category_id)||b.category)} · ${b.units} Units · ${(b.steps||[]).length}단계</p></div>${button('교재 정보 수정',`editBookInfo('${b.id}')`,'secondary')}${button('학습 단계 편집',`editBook('${b.id}')`,'secondary')}</div>`).join('')}</div>`}
async function addBook(){let title=document.getElementById('bookTitle').value.trim(),units=Number(document.getElementById('bookUnits').value),categoryId=document.getElementById('bookCategory').value,category=categoryName(categoryId);if(!title||!Number.isInteger(units)||units<1||units>200)return msg('교재명과 Unit 개수를 확인해 주세요.');try{let {error}=await sb.from('books').insert({title,category,category_id:categoryId||null,units,steps:DEFAULT_STEPS});if(error)throw error;await loadData();render()}catch(e){fail(e)}}
async function editBookInfo(id){
 const b=getBook(id);if(!b)return msg('교재를 찾지 못했습니다.');
 const existingCategory=b.category_id||'';
 const options=categoryOptions(existingCategory);
 const fallback=existingCategory?'':'<option value="" selected>기존 카테고리 유지 ('+E(b.category||'미지정')+')</option>';
 const modal=document.createElement('div');modal.id='bookInfoModal';
 modal.style.cssText='position:fixed;inset:0;background:#14281cb3;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
 modal.innerHTML='<div class="card" style="width:min(520px,100%);max-height:90vh;overflow:auto"><h2>📚 교재 정보 수정</h2>'+field('교재명','editBookTitle','text',b.title)+ '<div class="field"><label>카테고리</label><select id="editBookCategory">'+fallback+options+'</select></div>'+field('Unit 개수','editBookUnits','number',b.units,'min="1" max="200"')+'<p class="muted">Unit 수를 줄이면 기존 진도와 자료가 범위를 벗어날 수 있어요. 기존 기록은 자동 삭제되지 않습니다.</p><div class="row">'+button('저장',`saveBookInfo('${id}')`)+button('취소','document.getElementById(\'bookInfoModal\').remove()','secondary')+'</div></div>';
 document.body.appendChild(modal);
}
async function saveBookInfo(id){
 const b=getBook(id),title=document.getElementById('editBookTitle').value.trim(),units=Number(document.getElementById('editBookUnits').value),categoryId=document.getElementById('editBookCategory').value;
 if(!title||!Number.isInteger(units)||units<1||units>200)return msg('교재명과 Unit 개수를 확인해 주세요.');
 if(units<b.units){
  const affected=(cache.assignments||[]).filter(a=>a.book_id===id).length;
  if(!confirm('Unit 개수를 '+b.units+'개에서 '+units+'개로 줄이시겠어요? '+(affected?'이 교재를 배정받은 학생 '+affected+'건의 진도에 영향을 줄 수 있습니다. ':'')+'기존 학습 기록은 자동 삭제되지 않습니다.'))return;
 }
 const changes={title,units};
 if(categoryId){changes.category_id=categoryId;changes.category=categoryName(categoryId)}
 try{const {error}=await sb.from('books').update(changes).eq('id',id);if(error)throw error;document.getElementById('bookInfoModal')?.remove();await loadData();render();msg('교재 정보가 저장되었습니다.')}catch(e){fail(e)}
}
async function editBook(id){let b=getBook(id);let raw=prompt('기본 학습 단계 이름을 줄바꿈으로 입력해 주세요.\n※ 기존 체크 기록과 단계 번호의 연관성이 달라질 수 있습니다.',b.steps.map(x=>x.name).join('\n'));if(raw===null)return;let names=raw.split('\n').map(x=>x.trim()).filter(Boolean);if(!names.length)return msg('최소 한 단계가 필요합니다.');if(!confirm('이 교재의 기본 학습 단계를 변경할까요? 이미 학습 중인 학생의 진행률에 영향을 줄 수 있습니다.'))return;let next=names.map(n=>b.steps.find(s=>s.name===n)||DEFAULT_STEPS.find(s=>s.name===n)||{name:n,desc:'학습을 마치고 체크하세요.',page:''});try{let {error}=await sb.from('books').update({steps:next}).eq('id',id);if(error)throw error;await loadData();render()}catch(e){fail(e)}}
function studentsView(){let students=(cache.profiles||[]).filter(x=>x.role==='student'),books=cache.books||[];return `<div class="notice">학생 계정은 Supabase Authentication에서 원장님이 생성하고, profiles 테이블에 연결합니다. 보안을 위해 앱 화면에서 임의 계정을 만들지 않습니다. README.md의 안내를 확인하세요.</div><div class="card"><h2>학생에게 교재 배정</h2><div class="row"><div class="field"><label>학생</label><select id="asStudent">${students.map(s=>`<option value="${s.id}">${E(s.display_name)}</option>`).join('')}</select></div><div class="field"><label>교재</label><select id="asBook">${books.map(b=>`<option value="${b.id}">${E(b.title)}</option>`).join('')}</select></div>${field('시작 Unit','asStart','number',1,'min="1" max="200"')}</div>${button('+ 교재 배정','addAssignment()')}</div><div class="card"><h2>현재 배정</h2>${(cache.assignments||[]).map(a=>`<div class="item row between"><div><b>${E(getStudent(a.student_id)?.display_name)}</b> · ${E(getBook(a.book_id)?.title)}<p class="muted">Unit ${a.start_unit}부터 · ${percentage(a)}% 완료</p></div>${button('배정 해제',`removeAssignment('${a.id}')`,'danger')}</div>`).join('')}</div>`}
async function addAssignment(){let student_id=document.getElementById('asStudent').value,book_id=document.getElementById('asBook').value,start_unit=Number(document.getElementById('asStart').value),b=getBook(book_id);if(!student_id||!b||!Number.isInteger(start_unit)||start_unit<1||start_unit>b.units)return msg('학생, 교재, 시작 Unit을 확인해 주세요.');try{let {error}=await sb.from('assignments').insert({student_id,book_id,start_unit});if(error)throw error;await loadData();render()}catch(e){fail(e)}}
async function removeAssignment(id){if(!confirm('배정을 해제하면 이 배정의 학습 기록도 삭제됩니다. 계속할까요?'))return;try{let {error}=await sb.from('assignments').delete().eq('id',id);if(error)throw error;await loadData();render()}catch(e){fail(e)}}
function teachersView(){let teachers=(cache.profiles||[]).filter(p=>p.role==='teacher'),students=(cache.profiles||[]).filter(p=>p.role==='student'),links=cache.teacher_students||[];return `<div class="card"><h2>👩‍🏫 선생님 관리</h2><p class="muted">선생님 계정은 Supabase Authentication → Users에서 먼저 생성해야 합니다. 계정 생성 후 profiles에 teacher 권한을 연결하면 이 화면에 표시됩니다.</p><div class="row"><div class="field"><label>담당 선생님</label><select id="teacherSelect">${teachers.map(t=>`<option value="${t.id}">${E(t.display_name)}</option>`).join('')}</select></div><div class="field"><label>담당 학생</label><select id="teacherStudent">${students.map(t=>`<option value="${t.id}">${E(t.display_name)}</option>`).join('')}</select></div></div>${button('+ 담당 학생 지정','assignTeacher()')}</div><div class="card"><h2>담당 현황</h2>${teachers.length?teachers.map(t=>`<div class="item"><b>${E(t.display_name)}</b>${links.filter(x=>x.teacher_id===t.id).map(x=>`<div class="row between"><span>↳ ${E(getStudent(x.student_id)?.display_name||'학생')}</span>${button('담당 해제',`unassignTeacher('${t.id}','${x.student_id}')`,'danger')}</div>`).join('')||'<p class="muted">아직 담당 학생이 없습니다.</p>'}</div>`).join(''):'<p class="empty">등록된 선생님이 없습니다.</p>'}</div>`}
async function assignTeacher(){let teacher_id=document.getElementById('teacherSelect')?.value,student_id=document.getElementById('teacherStudent')?.value;if(!teacher_id||!student_id)return msg('선생님과 학생을 먼저 등록해 주세요.');try{let {error}=await sb.from('teacher_students').upsert({teacher_id,student_id},{onConflict:'teacher_id,student_id'});if(error)throw error;await loadData();render()}catch(e){fail(e)}}
async function unassignTeacher(teacher_id,student_id){if(!confirm('이 학생의 담당을 해제할까요?'))return;try{let {error}=await sb.from('teacher_students').delete().eq('teacher_id',teacher_id).eq('student_id',student_id);if(error)throw error;await loadData();render()}catch(e){fail(e)}}
function renderTeacher(){let links=cache.teacher_students||[],ids=new Set(links.filter(x=>x.teacher_id===me.id).map(x=>x.student_id)),as=(cache.assignments||[]).filter(a=>ids.has(a.student_id));app.innerHTML=`<div class="hero"><span class="tag">TEACHER DASHBOARD</span><h1>안녕하세요, ${E(profile.display_name)} 선생님 🌿</h1><p>담당 학생의 학습을 확인하고 마무리해 주세요.</p></div><div class="grid"><div class="card"><h2>담당 학생</h2><h1>${ids.size}명</h1></div><div class="card"><h2>교재 배정</h2><h1>${as.length}건</h1></div></div><div class="card"><h2>담당 학생 학습 현황</h2><div class="table"><table><thead><tr><th>학생</th><th>교재</th><th>현재 Unit</th><th>진행률</th><th>최종 확인</th></tr></thead><tbody>${as.map(a=>{let b=getBook(a.book_id),u=current(a);return `<tr><td>${E(getStudent(a.student_id)?.display_name||'학생')}</td><td>${E(b?.title||'교재')}</td><td>Unit ${u}</td><td>${percentage(a)}%</td><td>${checks(a,u).length===steps(a).length&&!approved(a,u)?button('최종 확인',`approveUnit('${a.id}',${u})`):approved(a,u)?'확인 완료':'학습 중'}</td></tr>`}).join('')}</tbody></table></div>${as.length?'':'<p class="empty">담당 학생에게 배정된 교재가 없습니다.</p>'}</div><div class="notice">교재 등록·배정은 원장님만 할 수 있습니다. 선생님의 개별 진도표 편집 기능은 다음 버전에서 추가됩니다.</div>`}
function plansView(){return `<div class="card"><h2>학생별 맞춤 학습진도표</h2><p class="muted">교재의 기본 단계를 학생별로 복사하여 변경합니다. 이미 학습한 학생의 단계는 수정 전에 기록을 확인해 주세요.</p><div class="field"><label>학생 · 교재</label><select id="planAs" onchange="planChanged()">${(cache.assignments||[]).map(a=>`<option value="${a.id}">${E(getStudent(a.student_id)?.display_name)} · ${E(getBook(a.book_id)?.title)}</option>`).join('')}</select></div><div id="planPanel"></div></div>`}
function planChanged(){let el=document.getElementById('planPanel');if(!el)return;let a=cache.assignments.find(x=>x.id===document.getElementById('planAs').value);if(!a){el.innerHTML='<p>교재 배정을 먼저 해 주세요.</p>';return}el.innerHTML=`${steps(a).map((s,i)=>`<div class="item row between"><div><b>${i+1}. ${E(s.name)}</b><p class="muted">${E(s.desc||'')}</p></div><div class="row">${button('↑',`moveStep('${a.id}',${i},-1)`,'secondary')}${button('↓',`moveStep('${a.id}',${i},1)`,'secondary')}${button('삭제',`removeStep('${a.id}',${i})`,'danger')}</div></div>`).join('')}<div class="row">${field('새 단계 이름','stepName')}${field('학습 안내','stepDesc')}</div>${button('+ 단계 추가',`addStep('${a.id}')`)} ${button('교재 기본으로 복원',`resetSteps('${a.id}')`,'secondary')}`}
async function updateSteps(id,fn){let a=cache.assignments.find(x=>x.id===id);if(!a)return;let s=structuredClone(steps(a));fn(s);if(!s.length)return msg('학습 단계는 최소 한 개 필요합니다.');let hasProgress=(cache.progress||[]).some(p=>p.assignment_id===id);if(hasProgress&&!confirm('이미 체크된 학습 기록이 있습니다. 단계 변경 시 기존 체크 번호의 의미가 달라질 수 있습니다. 그래도 수정할까요?'))return;try{let {error}=await sb.from('assignments').update({custom_steps:s}).eq('id',id);if(error)throw error;await loadData();render()}catch(e){fail(e)}}
function addStep(id){let name=document.getElementById('stepName').value.trim(),desc=document.getElementById('stepDesc').value.trim();if(!name)return msg('단계 이름을 입력하세요.');updateSteps(id,s=>s.push({name,desc,page:''}))}function removeStep(id,i){updateSteps(id,s=>s.splice(i,1))}function moveStep(id,i,d){updateSteps(id,s=>{let j=i+d;if(j>=0&&j<s.length)[s[i],s[j]]=[s[j],s[i]]})}
async function resetSteps(id){if(!confirm('교재 기본 진도표로 되돌릴까요?'))return;try{let {error}=await sb.from('assignments').update({custom_steps:null}).eq('id',id);if(error)throw error;await loadData();render()}catch(e){fail(e)}}
function materialsView(){return `<div class="card"><h2>Unit별 학습 자료 연결</h2><div class="notice">이번 버전은 HTTPS 링크 연결을 지원합니다. 실제 MP3 업로드 및 비공개 파일 전송은 별도 스토리지 권한 설계 후 추가합니다.</div><div class="row"><div class="field"><label>교재</label><select id="matBook" onchange="matBookChanged()">${(cache.books||[]).map(b=>`<option value="${b.id}">${E(b.title)}</option>`).join('')}</select></div><div class="field"><label>Unit</label><select id="matUnit" onchange="matUnitChanged()"></select></div></div>${field('단어 MP3 URL','matWord','url')}${field('리딩 MP3 URL','matReading','url')}${field('클래스카드 URL','matClasscard','url')}${field('출판사 자료실 URL','matPublisher','url')}${button('자료 저장','saveMaterial()')}</div>`}
function matBookChanged(){let b=getBook(document.getElementById('matBook')?.value),el=document.getElementById('matUnit');if(!el)return;el.innerHTML=Array.from({length:b?.units||0},(_,i)=>`<option value="${i+1}">Unit ${i+1}</option>`).join('');matUnitChanged()}
function matUnitChanged(){let b=document.getElementById('matBook')?.value,u=Number(document.getElementById('matUnit')?.value),m=(cache.materials||[]).find(x=>x.book_id===b&&x.unit===u)||{};for(let [id,k] of [['matWord','word_url'],['matReading','reading_url'],['matClasscard','classcard_url'],['matPublisher','publisher_url']])document.getElementById(id).value=m[k]||''}
async function saveMaterial(){let book_id=document.getElementById('matBook').value,unit=Number(document.getElementById('matUnit').value);if(!book_id||!unit)return msg('교재와 Unit을 선택해 주세요.');let v={book_id,unit};for(let [id,k] of [['matWord','word_url'],['matReading','reading_url'],['matClasscard','classcard_url'],['matPublisher','publisher_url']]){let val=document.getElementById(id).value.trim();if(val&&!/^https:\/\//i.test(val))return msg('링크는 https:// 로 시작해야 합니다.');v[k]=val||null}try{let {error}=await sb.from('materials').upsert(v,{onConflict:'book_id,unit'});if(error)throw error;await loadData();msg('Unit 자료를 저장했습니다.');render()}catch(e){fail(e)}}
start().catch(e=>{console.error(e);app.innerHTML=`<div class="notice">앱 시작 오류: ${E(e.message)}</div>`});
</script></body></html>
